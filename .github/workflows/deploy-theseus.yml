name: Deploy Theseus and the Labyrinth

on:
  push:
    branches: [main]
    paths:
      - 'theseus-labyrinth/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p _site
          cp "theseus-labyrinth/theseus-labyrinth.html" _site/theseus-labyrinth.html
          cp "theseus-labyrinth/theseus-labyrinth-screenshot.png" _site/theseus-labyrinth-screenshot.png

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: .
          keep_files: true