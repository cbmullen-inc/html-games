name: Deploy Orpheus and Eurydice

on:
  push:
    branches: [main]
    paths:
      - 'orpheus-eurydice/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p _site
          cp "orpheus-eurydice/orpheus-eurydice.html" _site/orpheus-eurydice.html
          cp "orpheus-eurydice/orpheus-eurydice-screenshot.png" _site/orpheus-eurydice-screenshot.png

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: .
          keep_files: true